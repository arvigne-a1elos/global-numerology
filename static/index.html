<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Numerology - A1ELOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            max-width: 200px;
            height: auto;
        }
        h1 {
            font-size: 2.5em;
            color: #C9A94E;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #888;
            font-size: 1.1em;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 40px 30px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: #C9A94E;
            font-size: 0.9em;
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #C9A94E;
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #C9A94E;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            letter-spacing: 1px;
        }
        .btn-primary:hover {
            background: #b8962e;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            display: none;
            margin-top: 30px;
            text-align: left;
        }
        .result.visible {
            display: block;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-label {
            color: #888;
            font-size: 0.9em;
        }
        .result-value {
            color: #C9A94E;
            font-weight: 700;
            font-size: 1.1em;
        }
        .error {
            color: #e74c3c;
            margin-top: 16px;
            display: none;
        }
        .error.visible {
            display: block;
        }
        .loading {
            display: none;
            margin-top: 20px;
            color: #C9A94E;
        }
        .loading.visible {
            display: block;
        }
        .footer {
            margin-top: 40px;
            color: #444;
            font-size: 0.8em;
        }
        .vib {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/static/logo.png" alt="A1ELOS" onerror="this.style.display='none'">
        </div>
        <h1>MAPA NUMEROLÓGICO</h1>
        <p class="subtitle">Descubra os números que regem sua vida</p>

        <div class="card">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="name" placeholder="Digite seu nome completo" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" id="birth_date">
            </div>
            <div class="form-group">
                <label>Email (opcional - receba o PDF)</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="off">
            </div>
            <button class="btn-primary" id="calcBtn" onclick="calcular()">CALCULAR AGORA</button>

            <div class="loading" id="loading">Calculando seu mapa...</div>
            <div class="error" id="error"></div>

            <div class="result" id="result">
                <div class="result-item">
                    <span class="result-label">Caminho de Vida</span>
                    <span class="result-value" id="res_life_path">-</span>
                </div>
                <div class="vib" id="vib_life_path"></div>
                <div class="result-item">
                    <span class="result-label">Expressão</span>
                    <span class="result-value" id="res_expression">-</span>
                </div>
                <div class="vib" id="vib_expression"></div>
                <div class="result-item">
                    <span class="result-label">Motivação</span>
                    <span class="result-value" id="res_soul_urge">-</span>
                </div>
                <div class="vib" id="vib_soul_urge"></div>
                <div class="result-item">
                    <span class="result-label">Personalidade</span>
                    <span class="result-value" id="res_personality">-</span>
                </div>
                <div class="vib" id="vib_personality"></div>
                <div class="result-item">
                    <span class="result-label">Destino</span>
                    <span class="result-value" id="res_destiny">-</span>
                </div>
                <div class="vib" id="vib_destiny"></div>
                <div class="result-item">
                    <span class="result-label">Idade</span>
                    <span class="result-value" id="res_age">-</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Signo</span>
                    <span class="result-value" id="res_sign">-</span>
                </div>
            </div>
        </div>
        <div class="footer">© A1ELOS Consultoria - Todos os direitos reservados</div>
    </div>

    <script>
        async function calcular() {
            const name = document.getElementById('name').value.trim();
            const birth_date = document.getElementById('birth_date').value;
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('calcBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            error.classList.remove('visible');
            result.classList.remove('visible');
            loading.classList.add('visible');
            btn.disabled = true;

            if (!name || name.length < 2) {
                error.textContent = 'Por favor, digite seu nome completo.';
                error.classList.add('visible');
                loading.classList.remove('visible');
                btn.disabled = false;
                return;
            }
            if (!birth_date) {
                error.textContent = 'Por favor, selecione sua data de nascimento.';
                error.classList.add('visible');
                loading.classList.remove('visible');
                btn.disabled = false;
                return;
            }

            try {
                const res = await fetch('/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, birth_date, email })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'Erro ao calcular');
                }
                document.getElementById('res_life_path').textContent = data.life_path;
                document.getElementById('res_expression').textContent = data.expression;
                document.getElementById('res_soul_urge').textContent = data.soul_urge;
                document.getElementById('res_personality').textContent = data.personality;
                document.getElementById('res_destiny').textContent = data.destiny;
                document.getElementById('res_age').textContent = data.age;
                document.getElementById('res_sign').textContent = data.sign;
                document.getElementById('vib_life_path').textContent = data.vib_life_path;
                document.getElementById('vib_expression').textContent = data.vib_expression;
                document.getElementById('vib_soul_urge').textContent = data.vib_soul_urge;
                document.getElementById('vib_personality').textContent = data.vib_personality;
                document.getElementById('vib_destiny').textContent = data.vib_destiny;
                result.classList.add('visible');
            } catch (e) {
                error.textContent = e.message || 'Erro ao conectar com o servidor.';
                error.classList.add('visible');
            } finally {
                loading.classList.remove('visible');
                btn.disabled = false;
            }
        }

        document.getElementById('name').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') calcular();
        });
        document.getElementById('birth_date').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') calcular();
        });
        document.getElementById('email').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') calcular();
        });
    </script>
</body>
</html>
