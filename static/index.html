// ====== CALCULADORA ======
function calcMap(){
  var name=document.getElementById('calcName').value.trim();var date=document.getElementById('calcDate').value;
  if(!name||!date){alert('Preencha nome e data');return}
  var parts=date.split('-');var d=parseInt(parts[2]),m=parseInt(parts[1]),y=parseInt(parts[0]);
  function sumN(n){while(n>9&&n!==11&&n!==22)n=String(n).split('').reduce(function(a,b){return a+parseInt(b)},0);return n}
  var cv=sumN(d+m+y);var ex=sumN(name.replace(/[^A-Za-zÀ-ÿ]/g,'').toUpperCase().split('').reduce(function(a,b){var v=b.charCodeAt(0)-64;if(v>26)v-=26;return a+(v>0&&v<27?v:0)},0));
  var vogais=name.replace(/[^AEIOUÁÉÍÓÚÀÂÊÔÃÕaeiouáéíóúàâêôãõ]/g,'').toUpperCase();
  var sa=vogais.split('').reduce(function(a,b){var v=b.charCodeAt(0)-64;if(v>26)v-=26;return a+(v>0&&v<27?v:0)},0);var sa=sumN(sa);
  var consoantes=name.replace(/[AEIOUÁÉÍÓÚÀÂÊÔÃÕaeiouáéíóúàâêôãõ\s]/g,'').toUpperCase();
  var pe=consoantes.split('').reduce(function(a,b){var v=b.charCodeAt(0)-64;if(v>26)v-=26;return a+(v>0&&v<27?v:0)},0);var pe=sumN(pe);
  var dest=sumN(cv+ex);
  document.getElementById('result').style.display='block';
  document.getElementById('rCv').textContent=t('calc_life_path')+': '+cv;
  document.getElementById('rEx').textContent=t('calc_expression')+': '+ex;
  document.getElementById('rSa').textContent=t('calc_soul_urge')+': '+sa;
  document.getElementById('rPe').textContent=t('calc_personality')+': '+pe;
  document.getElementById('rDest').textContent=t('calc_destiny')+': '+dest;
  document.getElementById('calcResult').scrollIntoView({behavior:'smooth'})
}

document.addEventListener('DOMContentLoaded',function(){
  var saved=localStorage.getItem('a1elos-lang');if(saved)setLang(saved);
  renderEnergyGrid();
  // Seção scroll
  document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var el=document.querySelector(this.getAttribute('href'));if(el)el.scrollIntoView({behavior:'smooth'})})})
});
</script>
